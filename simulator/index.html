<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Clockface Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Canvas Clockface Simulator</h1>
        <div class="controls">
            <label for="config-select">Select Animation:</label>
            <select id="config-select">
                <option value="">Loading...</option>
            </select>
        </div>
        
        <div class="matrix-container">
            <canvas id="matrix" width="64" height="64"></canvas>
            <div id="loading" class="hidden">Loading...</div>
        </div>
        
        <div class="info">
            <h2 id="config-name">-</h2>
            <p>Author: <span id="config-author">-</span></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
